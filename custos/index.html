<!--
  Portal de Custos e Despesas — Torre de Controle.

  Os dados vêm injetados por `_tools/_conta_azul_gerar_portal.py`, no bloco
  marcado lá embaixo (a marca é literal e aparece exatamente duas vezes no
  arquivo, abrindo e fechando os dados — por isso não se escreve ela aqui em
  cima: a busca do gerador casaria do comentário até o bloco e apagaria a página
  inteira no caminho. Já aconteceu.)

  A página não fala com o Conta Azul: se falasse, o token da contabilidade da
  empresa viajaria dentro do HTML.

  TRÊS REGRAS DE LEITURA que valem para tudo aqui:

  · CUSTO É POR COMPETÊNCIA — o mês em que o gasto aconteceu. A fila de
    pagamento é por VENCIMENTO, que é quando o dinheiro sai. Uma compra em 12x
    custou o mês em que aconteceu e sai do caixa em doze pedaços.

  · TRANSFERÊNCIA E EMPRÉSTIMO FICAM DE FORA por padrão: é dinheiro andando
    entre contas da própria casa, que entra como despesa numa ponta e receita na
    outra. O botão no topo mostra tudo, para conferir saldo de conta.

  · O ANO ANTERIOR VEM JUNTO. Quase todo número desta tela existe para ser
    comparado com o mesmo intervalo do ano passado — sem isso, "gastamos
    R$ 600 mil" não é informação, é só um número grande.

  Os gráficos são desenhados à mão em SVG, sem biblioteca: são cinco tipos,
  todos precisam de rótulo em português e formato de real, e uma biblioteca
  genérica custaria mais adaptação do que as ~150 linhas que eles ocupam.
-->
<style>
  /* ===================== identidade ===================== */
  :root{
    --breu:#071322; --placa:#0E1E33; --placa2:#142943; --fio:#1D3A5C; --fio2:#2A4E77;
    --tinta:#E6EFF9; --tinta2:#8AA4C2; --tinta3:#5C7999;
    --sinal:#4CC2FF; --sinal2:#2B7FD4; --sinal3:#1B558F; --sinal4:#3E6187;
    --alta:#3DD68C; --baixa:#FF7A85; --ouro:#D6B57E;
    --disp:'Segoe UI Variable Display','Segoe UI Semibold','Segoe UI',system-ui,sans-serif;
    --corpo:'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;
    --mono:'Cascadia Mono','Consolas','SF Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--breu);color:var(--tinta);font-family:var(--corpo);line-height:1.5;
    min-height:100vh;-webkit-font-smoothing:antialiased}
  .num{font-variant-numeric:tabular-nums}
  .rot{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--tinta3)}
  svg{display:block;max-width:100%}
  a{color:var(--sinal)}

  /* ===================== login ===================== */
  #login-overlay{position:fixed;inset:0;background:linear-gradient(150deg,#071322,#122c4c);
    display:flex;align-items:center;justify-content:center;z-index:1000}
  .login-box{background:rgba(255,255,255,.05);border:1px solid var(--fio);border-radius:16px;
    padding:40px 36px;width:100%;max-width:380px;text-align:center;margin:0 12px}
  .login-logo{font-size:38px;margin-bottom:10px}
  .login-title{font-family:var(--disp);font-size:19px;font-weight:700;margin-bottom:4px}
  .login-sub{font-size:13px;color:var(--tinta3);margin-bottom:22px}
  .login-btn{width:100%;padding:13px;border-radius:10px;border:none;background:var(--sinal);
    color:#04101C;font-family:var(--corpo);font-size:15px;font-weight:700;cursor:pointer}
  .login-btn:hover{filter:brightness(1.08)}
  .login-erro{color:var(--baixa);font-size:13px;margin-top:12px;min-height:18px;line-height:1.5}

  /* ===================== estrutura ===================== */
  #main{display:none;min-height:100vh}
  .topo{position:sticky;top:0;z-index:40;background:rgba(7,19,34,.94);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--fio);padding:12px 22px;display:flex;align-items:center;
    gap:14px;flex-wrap:wrap}
  .topo .ic{font-size:22px}
  .topo h1{font-family:var(--disp);font-size:16px;font-weight:700;letter-spacing:-.01em}
  .topo .quando{font-size:11.5px;color:var(--tinta3)}
  .voltar{margin-left:auto;font-size:12.5px;color:var(--tinta2);text-decoration:none;
    border:1px solid var(--fio);padding:7px 13px;border-radius:8px}
  .voltar:hover{color:var(--tinta);border-color:var(--fio2)}
  .corpo{display:flex;align-items:flex-start}

  /* ===================== barra lateral ===================== */
  .rail{width:196px;flex:none;border-right:1px solid var(--fio);padding:16px 12px 40px;
    background:rgba(0,0,0,.17);position:sticky;top:57px;height:calc(100vh - 57px);overflow-y:auto}
  .rail button{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;
    font-family:var(--corpo);font-size:12.5px;color:var(--tinta2);background:none;border:none;
    width:100%;text-align:left;cursor:pointer;margin-bottom:2px}
  .rail button:hover{color:var(--tinta);background:rgba(255,255,255,.035)}
  .rail button[aria-current=page]{background:rgba(76,194,255,.13);color:var(--sinal);font-weight:650}
  .rail button:focus-visible{outline:2px solid var(--sinal);outline-offset:-2px}
  .rail .gr{margin:16px 0 7px;padding-left:10px}
  .abrir-rail{display:none}

  .tela{flex:1;min-width:0;padding:18px 22px 70px}

  /* ===================== filtros ===================== */
  .filtros{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px;
    background:var(--placa);border:1px solid var(--fio);border-radius:12px;padding:11px 13px}
  .fg{display:flex;align-items:center;gap:7px}
  select{background:rgba(0,0,0,.3);color:var(--tinta);border:1px solid var(--fio);border-radius:8px;
    padding:7px 9px;font-family:var(--corpo);font-size:12.5px;max-width:210px}
  select:focus{outline:none;border-color:var(--sinal)}
  .chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--tinta2);background:transparent;border:1px solid var(--fio);padding:7px 12px;
    border-radius:20px;cursor:pointer}
  .chip:hover{border-color:var(--fio2);color:var(--tinta)}
  .chip[aria-pressed=true]{background:rgba(76,194,255,.14);border-color:var(--sinal);color:var(--sinal)}
  .chip:focus-visible,button:focus-visible{outline:2px solid var(--sinal);outline-offset:2px}
  .limpar{margin-left:auto;font-family:var(--corpo);font-size:12px;color:var(--tinta3);
    background:none;border:none;cursor:pointer;text-decoration:underline}
  .limpar:hover{color:var(--tinta)}

  /* ===================== peças ===================== */
  .grade{display:grid;gap:13px;margin-bottom:13px}
  .painel{background:var(--placa2);border:1px solid var(--fio);border-radius:11px;padding:15px 16px;
    min-width:0;margin-bottom:13px}
  .grade .painel{margin-bottom:0}
  .painel h2{font-family:var(--disp);font-size:13.5px;font-weight:650;margin-bottom:2px}
  .painel .leg{font-size:11.5px;color:var(--tinta3);margin-bottom:12px;line-height:1.55}

  .kpi{background:var(--placa2);border:1px solid var(--fio);border-radius:11px;padding:14px 15px;
    position:relative;overflow:hidden;min-width:0}
  .kpi .v{font-family:var(--disp);font-size:25px;font-weight:700;letter-spacing:-.025em;margin:5px 0 3px}
  .kpi .d{font-size:11.5px;font-weight:650;display:flex;align-items:center;gap:5px}
  .kpi .sp{position:absolute;right:0;bottom:0;opacity:.45}
  .trilho{position:absolute;left:0;top:0;bottom:0;width:3px}
  .sobe{color:var(--alta)} .desce{color:var(--baixa)} .neutro{color:var(--tinta3)}

  .alerta{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--fio)}
  .alerta:last-child{border-bottom:none;padding-bottom:0}
  .alerta .pt{width:7px;height:7px;border-radius:50%;margin-top:6px;flex:none}
  .alerta b{font-size:13px;font-weight:650;display:block;margin-bottom:2px}
  .alerta small{font-size:11.5px;color:var(--tinta3);line-height:1.55;display:block}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--tinta3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--fio);
    font-weight:400;white-space:nowrap}
  td{padding:7px 8px;border-bottom:1px solid rgba(29,58,92,.5);vertical-align:top}
  td.r,th.r{text-align:right}
  tr.cl{cursor:pointer}
  tr.cl:hover td{background:rgba(76,194,255,.07)}
  .rolar{overflow-x:auto}
  .tag{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;
    padding:2px 7px;border-radius:10px;white-space:nowrap;text-transform:uppercase}
  .tag.venc{background:rgba(255,122,133,.16);color:var(--baixa)}
  .tag.perto{background:rgba(214,181,126,.16);color:var(--ouro)}
  .tag.ok{background:rgba(61,214,140,.13);color:var(--alta)}
  .tag.mov{background:rgba(76,194,255,.13);color:var(--sinal)}

  .migalha{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:13px;margin-bottom:13px}
  .migalha button{font-family:var(--corpo);font-size:13px;color:var(--sinal);background:none;
    border:none;cursor:pointer;padding:3px 2px;border-radius:4px}
  .migalha button:hover{text-decoration:underline}
  .migalha span{color:var(--tinta3)}
  .migalha b{font-weight:650}
  .dims{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px}

  .vazio{text-align:center;color:var(--tinta3);padding:34px 18px;font-size:13px}
  .nota{font-size:12px;color:var(--tinta3);line-height:1.65;margin-top:12px;padding-left:12px;
    border-left:2px solid var(--fio2);max-width:84ch}
  .nota b{color:var(--tinta2)}
  .cores{display:flex;gap:15px;flex-wrap:wrap;font-size:11.5px;color:var(--tinta2);margin-top:11px}
  .cores i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  @media(max-width:980px){
    .rail{position:fixed;left:0;top:57px;z-index:39;transform:translateX(-100%);transition:transform .2s}
    .rail.aberto{transform:none}
    .abrir-rail{display:inline-block;font-family:var(--corpo);font-size:12.5px;color:var(--tinta2);
      background:none;border:1px solid var(--fio);border-radius:8px;padding:7px 12px;cursor:pointer}
    .grade{grid-template-columns:1fr!important}
  }
</style>
</head>

        </div>
        <div class="fg"><span class="rot">Ambiente</span>
          <select id="f-amb" onchange="aplicar()"></select>
        </div>
        <button class="chip" id="f-mov" aria-pressed="false" onclick="alternarMov()"

          Transferências fora</button>
        <button class="limpar" onclick="limpar()">limpar filtros</button>
      </div>
      <div id="vistas"></div>
    </main>
  </div>
</div>

const brl = v => 'R$ ' + Math.round(v).toLocaleString('pt-BR');
function curto(v){
  const a = Math.abs(v);
  if(a >= 1e6) return 'R$ ' + (v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:2}) + ' mi';
  if(a >= 1e3) return 'R$ ' + Math.round(v/1e3).toLocaleString('pt-BR') + ' mil';
  return brl(v);
}
const pct = (a,b) => b ? (100*(a-b)/Math.abs(b)) : 0;
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cortar = (t,n) => String(t).length > n ? String(t).slice(0,n-1)+'…' : String(t);
const fData = d => d ? d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4) : '—';
const fMes = m => MES[+m.slice(5,7)-1] + '/' + m.slice(2,4);

}

const anoAntes = m => (+m.slice(0,4)-1) + m.slice(4);

/* ===================== filtro ===================== */
function passa(l, campo, ignoraPeriodo){
  if(!F.mov && l[MOV]) return false;
  if(F.amb !== 'todos' && l[AMB] !== +F.amb) return false;
  if(ignoraPeriodo) return true;
  const m = (l[campo]||'').slice(0,7);
  return !!m && m >= F.de && m <= F.ate;
}
const filtrar = (lista, campo, ign) => lista.filter(l => passa(l, campo, ign));
// A mesma janela um ano atrás. Sempre o mesmo INTERVALO, nunca o ano fechado:
// comparar oito meses com doze é o erro clássico deste tipo de tela.
function doAnoAnterior(lista){
  const de = anoAntes(F.de), ate = anoAntes(F.ate);
  return lista.filter(function(l){
    if(!F.mov && l[MOV]) return false;
    if(F.amb !== 'todos' && l[AMB] !== +F.amb) return false;
    const m = (l[COMP]||'').slice(0,7);
    return !!m && m >= de && m <= ate;
  });
}

function sparkline(vals, cor, w, h){
  w = w||104; h = h||30;
  if(!vals.length) return '';
  const mx = Math.max.apply(null, vals.concat([1])), passo = w/((vals.length-1)||1);
  const pts = vals.map((v,i) => [i*passo, h - (Math.max(v,0)/mx)*(h-3) - 1.5]);
  const d = pts.map((p,i) => (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return '<svg class="sp" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true">'+
    '<path d="'+d+' L'+w+' '+h+' L0 '+h+' Z" fill="'+cor+'" opacity=".16"/>'+
    '<path d="'+d+'" fill="none" stroke="'+cor+'" stroke-width="1.6"/>'+
    '<circle cx="'+pts[pts.length-1][0].toFixed(1)+'" cy="'+pts[pts.length-1][1].toFixed(1)+
    '" r="2.4" fill="'+cor+'"/></svg>';
}

// Colunas de duas séries com uma linha por cima. O <title> dentro de cada grupo
// vira a dica do navegador: sem biblioteca, é o que dá o valor exato no mouse.
function colunas(rot, s1, s2, linha, alt){
  const w=680, h=alt||214, pe=52, pd=10, pt=12, pb=22;
  const iw=w-pe-pd, ih=h-pt-pb, n=rot.length || 1;
  const mx = Math.max.apply(null, s1.dados.concat(s2.dados, [1]));
  const passo = iw/n, larg = Math.min(15, passo/2.9);
  const y = v => pt + ih - (Math.max(v,0)/mx)*ih;
  let g='';
  for(let i=0;i<=4;i++){
    const yy = pt + ih*i/4;
    g += '<line x1="'+pe+'" y1="'+yy.toFixed(1)+'" x2="'+(w-pd)+'" y2="'+yy.toFixed(1)+
      '" stroke="'+C.fio+'" stroke-width="1"/><text x="'+(pe-7)+'" y="'+(yy+3.5).toFixed(1)+
      '" fill="'+C.tinta3+'" font-size="9" text-anchor="end" font-family="Consolas,monospace">'+
      curto(mx*(1-i/4)).replace('R$ ','')+'</text>';
  }
  let b='';
  rot.forEach(function(r,i){
    const cx = pe + passo*i + passo/2;
    b += '<g><title>'+esc(r)+' · '+s1.nome+' '+brl(s1.dados[i])+' · '+s2.nome+' '+brl(s2.dados[i])+
      (linha ? ' · '+linha.nome+' '+brl(linha.dados[i]) : '')+'</title>'+
      '<rect x="'+(cx-larg-1.5).toFixed(1)+'" y="'+y(s1.dados[i]).toFixed(1)+'" width="'+larg.toFixed(1)+
      '" height="'+Math.max(pt+ih-y(s1.dados[i]),0).toFixed(1)+'" fill="'+s1.cor+'" opacity=".92" rx="1.5"/>'+
      '<rect x="'+(cx+1.5).toFixed(1)+'" y="'+y(s2.dados[i]).toFixed(1)+'" width="'+larg.toFixed(1)+
      '" height="'+Math.max(pt+ih-y(s2.dados[i]),0).toFixed(1)+'" fill="'+s2.cor+'" opacity=".92" rx="1.5"/>'+
      '<text x="'+cx.toFixed(1)+'" y="'+(h-7)+'" fill="'+C.tinta3+'" font-size="9.5" text-anchor="middle" '+
      'font-family="Consolas,monospace">'+esc(r)+'</text></g>';
  });
  let l='';
  if(linha){
    const pts = linha.dados.map((v,i) => [pe+passo*i+passo/2, y(v)]);
    l = '<path d="'+pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+
      '" fill="none" stroke="'+linha.cor+'" stroke-width="2" stroke-dasharray="3 3"/>' +
      pts.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.6" fill="'+linha.cor+'"/>').join('');
  }
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" role="img" aria-label="Valores por período">'+g+b+l+'</svg>';
}

// Ranking horizontal. O valor vai DENTRO da barra quando cabe — jogado para

function ranking(itens, opts){

    itens.map(function(it,i){

      const cor = opts.cor ? opts.cor(it,i) : 'hsl('+(205-i*3)+' '+(72-i*3)+'% '+(58-i*2.2)+'%)';
      const dentro = bw > 78;
      const acao = opts.clique ? opts.clique(it,i) : null;
      return '<g'+(acao ? ' onclick="'+acao+'" role="button" tabindex="0" onkeydown="if(event.key===\'Enter\'){'+
          acao+'}" style="cursor:pointer"' : '')+'><title>'+esc(it[0])+' · '+brl(it[1])+
          (it[2]!=null ? ' · '+it[2]+' lançamento(s)' : '')+'</title>'+
        '<rect x="0" y="'+(y-3)+'" width="'+w+'" height="'+alt+'" fill="transparent"/>'+

    const A=P(R,ang),B=P(R,fim),Cc=P(r,fim),Dd=P(r,ang);
    p += '<g><title>'+esc(f[0])+' · '+brl(f[1])+' · '+(100*f[1]/tot).toFixed(1)+'%</title>'+
      '<path d="M'+A[0]+' '+A[1]+' A'+R+' '+R+' 0 '+gr+' 1 '+B[0]+' '+B[1]+' L'+Cc[0]+' '+Cc[1]+
      ' A'+r+' '+r+' 0 '+gr+' 0 '+Dd[0]+' '+Dd[1]+' Z" fill="'+f[2]+'" stroke="'+C.placa+
      '" stroke-width="1.5"/></g>';
    ang = fim;
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="max-width:210px;margin:0 auto" '+
    'role="img" aria-label="Composição do custo">'+p+
    '<text x="'+cx+'" y="'+(cy-1)+'" text-anchor="middle" fill="#E6EFF9" font-size="17" '+
    'font-weight="700" font-family="Segoe UI,system-ui">'+esc(tit)+'</text>'+
    '<text x="'+cx+'" y="'+(cy+15)+'" text-anchor="middle" fill="'+C.tinta3+'" font-size="9.5" '+
    'font-family="Consolas,monospace" letter-spacing="1">'+esc(sub)+'</text></svg>';
}

// Envelhecimento numa barra só, empilhada: a pergunta é "que fatia disso já
// venceu", e comparar fatias do mesmo todo pede uma barra, não cinco.
function faixasBarra(faixas){
  const w=680,h=56, tot = faixas.reduce((s,f)=>s+f[1],0)||1;
  let x=0, s='';
  faixas.forEach(function(f){
    const bw=(f[1]/tot)*w;
    s += '<g><title>'+esc(f[0])+' · '+brl(f[1])+'</title>'+
      '<rect x="'+x.toFixed(1)+'" y="0" width="'+Math.max(bw-1.5,1).toFixed(1)+'" height="22" '+
      'fill="'+f[2]+'" rx="2"/></g>';
    if(bw > 62) s += '<text x="'+(x+5).toFixed(1)+'" y="38" fill="'+C.tinta2+'" font-size="9.5" '+
      'font-family="Consolas,monospace">'+esc(f[0])+'</text><text x="'+(x+5).toFixed(1)+
      '" y="51" fill="#E6EFF9" font-size="11" font-weight="700" font-family="Consolas,monospace">'+
      curto(f[1]).replace('R$ ','')+'</text>';
    x += bw;
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" role="img" '+
    'aria-label="Envelhecimento das contas a pagar">'+s+'</svg>';
}

function cascata(passos, aoClicar){
  const w=680,h=254,pt=28,pb=44,ih=h-pt-pb, passo=w/(passos.length||1);
  let acc=0; const pontos=[];
  passos.forEach(function(p){
    const ini = p.total ? 0 : acc;
    const fim = p.total ? p.v : acc + p.delta;
    pontos.push({p:p, ini:ini, fim:fim});
    acc = p.total ? p.v : acc + p.delta;
  });
  const mx = Math.max.apply(null, pontos.map(o=>Math.max(o.ini,o.fim)).concat([1]));
  const y = v => pt + ih - (Math.max(v,0)/mx)*ih;
  let s='';
  pontos.forEach(function(o,i){
    const cx = passo*i + passo/2, lw = Math.min(60, passo*0.55);
    const y1 = y(Math.max(o.ini,o.fim)), y2 = y(Math.min(o.ini,o.fim));
    const acao = aoClicar ? aoClicar(i) : null;
    s += '<g'+(acao?' onclick="'+acao+'" role="button" tabindex="0" onkeydown="if(event.key===\'Enter\'){'+
        acao+'}" style="cursor:pointer"':'')+'><title>'+esc(o.p.nome)+' · '+brl(o.p.v)+'</title>'+
      '<rect x="'+(cx-passo/2).toFixed(1)+'" y="0" width="'+passo.toFixed(1)+'" height="'+h+'" fill="transparent"/>'+
      '<rect x="'+(cx-lw/2).toFixed(1)+'" y="'+y1.toFixed(1)+'" width="'+lw.toFixed(1)+'" height="'+
        Math.max(y2-y1,2).toFixed(1)+'" fill="'+o.p.cor+'" rx="2"/>'+
      '<text x="'+cx.toFixed(1)+'" y="'+(y1-8).toFixed(1)+'" text-anchor="middle" fill="#E6EFF9" '+
        'font-size="10.5" font-weight="700" font-family="Consolas,monospace">'+curto(o.p.v).replace('R$ ','')+'</text>'+
      '<text x="'+cx.toFixed(1)+'" y="'+(h-24)+'" text-anchor="middle" fill="'+C.tinta2+'" font-size="10">'+
        esc(cortar(o.p.nome,16))+'</text>'+
      '<text x="'+cx.toFixed(1)+'" y="'+(h-11)+'" text-anchor="middle" fill="'+C.tinta3+'" font-size="9" '+
        'font-family="Consolas,monospace">'+esc(o.p.dica||'')+'</text></g>';
    if(i < pontos.length-1 && !o.p.total)
      s += '<line x1="'+(cx+lw/2).toFixed(1)+'" y1="'+y(o.fim).toFixed(1)+'" x2="'+
        (passo*(i+1)+passo/2-lw/2).toFixed(1)+'" y2="'+y(o.fim).toFixed(1)+
        '" stroke="'+C.fio+'" stroke-width="1" stroke-dasharray="2 2"/>';
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" role="img" '+
    'aria-label="Cascata do resultado do período">'+s+'</svg>';
}

/* ===================== cartões ===================== */
// Duas funções porque a mesma seta significa coisas opostas: custo subindo é
// ruim, receita subindo é boa. Um parâmetro "inverter" seria mais curto e leria
// pior justamente no lugar onde importa.
function _kpi(rot, valor, cls, seta, texto, spark, trilho){
  return '<div class="kpi"><div class="trilho" style="background:'+trilho+'"></div>'+
    '<div class="rot">'+esc(rot)+'</div><div class="v num">'+esc(valor)+'</div>'+
    '<div class="d '+cls+'">'+seta+' '+esc(texto)+'</div>'+(spark||'')+'</div>';
}
const kpiCusto = (r,v,d,t,s,c) => _kpi(r, v, d===null?'neutro':(d>0?'desce':'sobe'),
  d===null?'':(d>0?'▲':'▼'), t, s, c);
const kpiReceita = (r,v,d,t,s,c) => _kpi(r, v, d===null?'neutro':(d>=0?'sobe':'desce'),
  d===null?'':(d>=0?'▲':'▼'), t, s, c);

/* ===================== agrupamento ===================== */
// As cinco maneiras de cortar o custo. Cada uma diz como achar a chave da linha
// e como transformar essa chave em nome — é isso que permite a mesma tela
// responder "por grupo", "por categoria" ou "por fornecedor" sem código repetido.
const DIM = {
  grupo: { rot:'Grupo',      chave: l => D.cat_grupo[l[CAT]], nome: k => D.grupo[k] || '—' },
  cat:   { rot:'Categoria',  chave: l => l[CAT],              nome: k => D.cat[k]   || '—' },
  forn:  { rot:'Fornecedor', chave: l => l[PES],              nome: k => D.forn[k]  || '—' },
  amb:   { rot:'Ambiente',   chave: l => l[AMB],              nome: k => D.amb[k]   || '—' },
  mes:   { rot:'Mês',        chave: l => l[COMP].slice(0,7),  nome: k => fMes(k) },
};
// Do mais largo ao mais fino. Descer é ir para o próximo desta fila que ainda
// não foi usado — assim o caminho nunca repete a mesma dimensão.
const ESCADA = ['grupo','cat','forn'];

function agrupar(linhas, dim){
  const m = new Map();
  linhas.forEach(function(l){
    const k = DIM[dim].chave(l);
    const a = m.get(k) || [0,0];
    a[0] += l[TOTAL]; a[1]++;
    m.set(k, a);
  });
  return Array.from(m.entries()).map(e => [DIM[dim].nome(e[0]), e[1][0], e[1][1], e[0]])
    .sort((a,b) => b[1]-a[1]);
}

/* ===================== filtros na tela ===================== */
function mesesDisponiveis(){
  const s = new Set();
  D.pagar.concat(D.receber).forEach(l => { if(l[COMP]) s.add(l[COMP].slice(0,7)); });
  return Array.from(s).sort();
}
// O período abre no ano corrente e fecha no mês atual. Compra parcelada nasce
// com as parcelas lançadas à frente e a receita dos meses futuros ainda não
// existe: abrir o ano inteiro mostraria um prejuízo que é só do calendário.
function padrao(){
  const ms = mesesDisponiveis(), ano = hoje.slice(0,4);
  const doAno = ms.filter(m => m.slice(0,4) === ano);
  const lista = doAno.length ? doAno : ms;
  return { de: lista[0],
           ate: lista.filter(m => m <= hoje.slice(0,7)).pop() || lista[lista.length-1] };
}
function montarFiltros(){
  const ms = mesesDisponiveis();
  const de = document.getElementById('f-de'), ate = document.getElementById('f-ate');
  de.innerHTML = ms.map(m => '<option value="'+m+'">'+fMes(m)+'</option>').join('');
  ate.innerHTML = de.innerHTML;
  const p = padrao(); F.de = p.de; F.ate = p.ate;
  de.value = F.de; ate.value = F.ate;

  // Ambientes na ordem do tamanho da despesa: quem decide quer os grandes
  // primeiro, e a ordem alfabética esconde o Oxy no meio da lista.
  const s = {};
  D.pagar.forEach(l => { if(!l[MOV]) s[l[AMB]] = (s[l[AMB]]||0) + l[TOTAL]; });
  document.getElementById('f-amb').innerHTML = '<option value="todos">Todos os ambientes</option>' +
    D.amb.map((n,i) => [i,n]).sort((a,b) => (s[b[0]]||0)-(s[a[0]]||0))
      .map(x => '<option value="'+x[0]+'">'+esc(x[1])+'</option>').join('');
}
function aplicar(){
  F.de = document.getElementById('f-de').value;
  F.ate = document.getElementById('f-ate').value;
  if(F.de > F.ate){                       // período invertido: corrige em vez de mostrar tela vazia
    const t = F.de; F.de = F.ate; F.ate = t;
    document.getElementById('f-de').value = F.de;
    document.getElementById('f-ate').value = F.ate;
  }
  F.amb = document.getElementById('f-amb').value;
  drCaminho = [];
  desenhar();
}
function alternarMov(){
  F.mov = !F.mov;
  const b = document.getElementById('f-mov');
  b.setAttribute('aria-pressed', String(F.mov));
  b.textContent = F.mov ? 'Transferências à vista' : 'Transferências fora';
  desenhar();
}
function limpar(){
  const p = padrao();
  F = { de:p.de, ate:p.ate, amb:'todos', mov:false };
  document.getElementById('f-de').value = F.de;
  document.getElementById('f-ate').value = F.ate;
  document.getElementById('f-amb').value = 'todos';
  const b = document.getElementById('f-mov');
  b.setAttribute('aria-pressed','false'); b.textContent = 'Transferências fora';
  drCaminho = []; drDim = 'grupo';
  desenhar();
}
function escolherAmb(i){
  F.amb = (F.amb === String(i)) ? 'todos' : String(i);
  document.getElementById('f-amb').value = F.amb;
  desenhar();
}

/* ===================== período ===================== */
function mesesNoFiltro(){
  const out = [];
  let a = +F.de.slice(0,4), m = +F.de.slice(5,7);
  const af = +F.ate.slice(0,4), mf = +F.ate.slice(5,7);
  while(a < af || (a === af && m <= mf)){
    out.push(a+'-'+String(m).padStart(2,'0'));
    if(m === 12){ a++; m = 1; } else { m++; }
    if(out.length > 60) break;            // trava contra período absurdo
  }
  return out;
}
const rotuloPeriodo = () => fMes(F.de) + ' a ' + fMes(F.ate);
const rotuloAnoAnterior = () => String(+F.ate.slice(0,4) - 1);

/* ===================== fila de pagamento ===================== */
// Sem recorte de período: uma parcela de uma compra antiga que vence semana que
// vem continua saindo do caixa. O período responde "quanto custou"; a fila
// responde "quanto sai", e uma coisa não pode apagar a outra.
function emAberto(){
  return D.pagar.filter(l => l[TOTAL]-l[PAGO] > 0.005 && passa(l, VENC, true))
                .sort((a,b) => a[VENC] < b[VENC] ? -1 : 1);
}
function faixas(){
  const f = { vencido:[0,0], ate30:[0,0], d3160:[0,0], d6190:[0,0], mais90:[0,0] };
  emAberto().forEach(function(l){
    const v = l[TOTAL]-l[PAGO];
    const k = l[VENC] < hoje ? 'vencido' : l[VENC] <= somarDias(hoje,30) ? 'ate30'
            : l[VENC] <= somarDias(hoje,60) ? 'd3160'
            : l[VENC] <= somarDias(hoje,90) ? 'd6190' : 'mais90';
    f[k][0] += v; f[k][1]++;
  });
  return f;
}

/* ===================== alertas ===================== */
// Cada alerta é uma regra fixa que olha os números e some sozinha quando o
// número volta ao normal. Nada aqui é escrito à mão para um mês específico.
function alertas(){
  const p = filtrar(D.pagar, COMP), pa = doAnoAnterior(D.pagar);
  const total = soma(p), fx = faixas(), saida = [];
  if(!total) return saida;

  const forn = agrupar(p, 'forn');
  if(forn.length && forn[0][1]/total > 0.10)
    saida.push(['baixa', 'Um só fornecedor concentra '+(100*forn[0][1]/total).toFixed(0)+'% de tudo',
      forn[0][0]+' soma '+curto(forn[0][1])+' no período, em '+forn[0][2]+' lançamento(s). '+
      'Concentração alta não é erro, mas é risco — e vale saber se é repasse de honorário ou compra mesmo.']);

  const c25 = {};
  agrupar(pa,'cat').forEach(c => c25[c[0]] = c[1]);
  agrupar(p,'cat').slice(0,12).forEach(function(c){
    const antes = c25[c[0]];
    if(!antes) return;
    const d = pct(c[1], antes);
    if(c[1] > 60000 && d > 35)
      saida.push(['ouro', c[0]+' subiu '+d.toFixed(0)+'% contra o ano passado',
        curto(c[1])+' agora contra '+curto(antes)+' no mesmo intervalo. '+
        'Vale conferir se é reajuste, volume novo ou lançamento em duplicidade.']);
    else if(antes > 60000 && d < -35)
      saida.push(['alta', c[0]+' caiu '+Math.abs(d).toFixed(0)+'%',
        'De '+curto(antes)+' para '+curto(c[1])+'. Se a atividade não caiu junto, '+
        'o gasto pode ter mudado de categoria.']);
  });

  if(fx.vencido[0] > 0)
    saida.push(['baixa', curto(fx.vencido[0])+' já venceram e continuam em aberto',
      fx.vencido[1]+' lançamento(s). Ou é pagamento atrasado, ou é baixa que ninguém deu no sistema.']);
  if(fx.ate30[0] > 0)
    saida.push(['ouro', curto(fx.ate30[0])+' vencem nos próximos 30 dias',
      fx.ate30[1]+' lançamento(s) — é a conta que chega antes do próximo fechamento.']);

  const sg = agrupar(p,'grupo').filter(g => g[0] === 'Sem grupo definido')[0];
  if(sg && sg[1]/total > 0.08)
    saida.push(['ouro', curto(sg[1])+' sem grupo definido no Conta Azul',
      (100*sg[1]/total).toFixed(0)+'% do custo cai fora da classificação de DRE. Isso não erra o '+
      'total, mas some da leitura por natureza do gasto.']);

  return saida.slice(0,6);
}

/* ===================== VISTA: torre ===================== */
function vistaTorre(){
  const p = filtrar(D.pagar, COMP), r = filtrar(D.receber, COMP);
  const pa = doAnoAnterior(D.pagar), ra = doAnoAnterior(D.receber);
  const custo = soma(p), receita = soma(r), custoA = soma(pa), receitaA = soma(ra);
  const resultado = receita-custo, resultadoA = receitaA-custoA;
  const fx = faixas();
  const aberto = Object.keys(fx).reduce((s,k)=>s+fx[k][0],0);

  const ms = mesesNoFiltro();

  const sc = porMes(p), sr = porMes(r), sres = sc.map((c,i) => sr[i]-c);

  return '<div class="grade" style="grid-template-columns:repeat(auto-fit,minmax(178px,1fr))">'+
    kpiCusto('Custo do período', curto(custo), custoA ? pct(custo,custoA) : null,
      custoA ? Math.abs(pct(custo,custoA)).toFixed(1)+'% vs '+rotuloAnoAnterior()+' ('+curto(custoA)+')'
             : 'sem comparação disponível', sparkline(sc, C.sinal), C.sinal2) +
    kpiReceita('Receita do período', curto(receita), receitaA ? pct(receita,receitaA) : null,
      receitaA ? Math.abs(pct(receita,receitaA)).toFixed(1)+'% vs '+rotuloAnoAnterior()+' ('+curto(receitaA)+')'
               : 'sem comparação disponível', sparkline(sr, C.alta), C.alta) +
    kpiReceita('Resultado', curto(resultado), (receitaA||custoA) ? resultado-resultadoA : null,
      (receitaA||custoA) ? curto(Math.abs(resultado-resultadoA))+
        (resultado>=resultadoA?' melhor':' pior')+' que '+rotuloAnoAnterior()
        : 'receita menos custo', '', C.ouro) +
    kpiCusto('Na fila de pagamento', curto(aberto), null, nAberto+' lançamento(s) em aberto', '', C.sinal) +
    kpiCusto('Concentração', conc.toFixed(0)+'%', null,
      'os 10 maiores, de '+forn.length+' fornecedores', '', C.ouro) +
  '</div>'+

  '<div class="grade" style="grid-template-columns:1.55fr 1fr">'+
    '<div class="painel"><h2>Custo e receita, mês a mês</h2>'+
      '<div class="leg">Por competência — o mês em que aconteceu. A linha pontilhada é o resultado do mês.</div>'+
      colunas(ms.map(fMes), {nome:'Receita',dados:sr,cor:C.alta}, {nome:'Custo',dados:sc,cor:C.sinal2},
        {nome:'Resultado',dados:sres,cor:C.ouro})+
      '<div class="cores"><span><i style="background:'+C.alta+'"></i>receita</span>'+
      '<span><i style="background:'+C.sinal2+'"></i>custo</span>'+
      '<span><i style="background:'+C.ouro+'"></i>resultado do mês</span></div></div>'+
    '<div class="painel"><h2>Onde olhar primeiro</h2>'+
      '<div class="leg">Escrito pela própria tela a partir dos números. Some sozinho quando o número volta ao normal.</div>'+
      (av.length ? av.map(a => '<div class="alerta">'+
        '<span class="pt" style="background:var(--'+a[0]+')"></span>'+
        '<div><b>'+esc(a[1])+'</b><small>'+esc(a[2])+'</small></div></div>').join('')
       : '<div class="vazio">Nada fora do lugar no período.</div>')+'</div>'+
  '</div>'+

  '<div class="grade" style="grid-template-columns:0.85fr 1.1fr 1.15fr">'+
    '<div class="painel"><h2>Natureza do gasto</h2>'+
      '<div class="leg">Pelos grupos que o próprio Conta Azul já classifica.</div>'+
      rosca(g, curto(custo).replace('R$ ',''), rotuloPeriodo().toUpperCase())+
      '<div class="cores">'+g.map(x=>'<span><i style="background:'+x[2]+'"></i>'+
        esc(cortar(x[0],20))+'</span>').join('')+'</div></div>'+
    '<div class="painel"><h2>Maiores categorias</h2>'+
      '<div class="leg">Clique numa barra para abrir a categoria em <b>Categorias</b>.</div>'+
      ranking(agrupar(p,'cat').slice(0,7), {corte:20, pe:146,
        clique: it => 'abrirCategoria('+it[3]+')'})+'</div>'+

      '<div class="leg">Quanto já venceu e quanto está chegando — por vencimento, sem recorte de mês.</div>'+
      faixasBarra([['vencido',fx.vencido[0],C.baixa],['até 30 dias',fx.ate30[0],C.sinal],
        ['31 a 60',fx.d3160[0],C.sinal2],['61 a 90',fx.d6190[0],C.sinal3],
        ['mais de 90',fx.mais90[0],C.sinal4]])+
      '<table style="margin-top:8px"><tbody>'+
      [['Vencido','vencido'],['Até 30 dias','ate30'],['31 a 60 dias','d3160'],
       ['61 a 90 dias','d6190'],['Mais de 90 dias','mais90']].map(f =>
        '<tr><td>'+f[0]+'</td><td class="r num">'+brl(fx[f[1]][0])+'</td>'+
        '<td class="r num" style="color:var(--tinta3)">'+fx[f[1]][1]+'</td></tr>').join('')+
      '</tbody></table></div>'+
  '</div>';
}

/* ===================== VISTA: contas a pagar ===================== */
function vistaPagar(){
  const ab = emAberto(), fx = faixas();
  const falta = ab.reduce((s,l)=>s+(l[TOTAL]-l[PAGO]),0);
  const em7 = ab.filter(l => l[VENC] >= hoje && l[VENC] <= somarDias(hoje,7));
  const porForn = new Map();
  ab.forEach(l => porForn.set(l[PES], (porForn.get(l[PES])||0) + (l[TOTAL]-l[PAGO])));
  const rankForn = Array.from(porForn.entries()).map(e => [D.forn[e[0]]||'—', e[1]])
    .sort((a,b)=>b[1]-a[1]).slice(0,8);

  return '<div class="grade" style="grid-template-columns:repeat(auto-fit,minmax(178px,1fr))">'+
    kpiCusto('Falta pagar', curto(falta), null, ab.length+' lançamento(s) em aberto', '', C.sinal) +
    kpiCusto('Vencido', curto(fx.vencido[0]), fx.vencido[0] ? 1 : null,
      fx.vencido[1]+' lançamento(s)', '', C.baixa) +
    kpiCusto('Vence em 7 dias', curto(em7.reduce((s,l)=>s+(l[TOTAL]-l[PAGO]),0)), null,
      em7.length+' lançamento(s)', '', C.ouro) +
    kpiCusto('Vence em 30 dias', curto(fx.ate30[0]), null, fx.ate30[1]+' lançamento(s)', '', C.sinal2) +
  '</div>'+
  '<div class="grade" style="grid-template-columns:1.5fr 1fr">'+
    '<div class="painel"><h2>Como a dívida se distribui no tempo</h2>'+
      '<div class="leg">Tudo que ainda tem saldo em aberto, na ordem em que chega.</div>'+
      faixasBarra([['vencido',fx.vencido[0],C.baixa],['até 30 dias',fx.ate30[0],C.sinal],
        ['31 a 60',fx.d3160[0],C.sinal2],['61 a 90',fx.d6190[0],C.sinal3],
        ['mais de 90',fx.mais90[0],C.sinal4]])+'</div>'+
    '<div class="painel"><h2>Para quem se deve mais</h2>'+
      '<div class="leg">Somando só o que está em aberto.</div>'+
      ranking(rankForn, {corte:24, pe:170, alt:24})+'</div>'+
  '</div>'+
  '<div class="painel"><h2>Lançamentos em aberto</h2>'+
    '<div class="leg">Por data de vencimento. Parcela paga sai da lista sozinha.</div>'+
    '<div class="rolar"><table><thead><tr><th>Vencimento</th><th>Situação</th><th>Fornecedor</th>'+
    '<th>Descrição</th><th>Categoria</th><th>Ambiente</th><th class="r">Total</th>'+
    '<th class="r">Falta pagar</th></tr></thead><tbody>'+
    (ab.length ? ab.slice(0,250).map(function(l){
      const sit = l[VENC] < hoje ? '<span class="tag venc">vencido</span>'
        : l[VENC] <= somarDias(hoje,7) ? '<span class="tag perto">esta semana</span>'
        : '<span class="tag ok">em dia</span>';
      return '<tr><td class="num">'+fData(l[VENC])+'</td>'+
        '<td>'+sit+(l[MOV]?' <span class="tag mov">movimentação</span>':'')+'</td>'+
        '<td>'+esc(cortar(D.forn[l[PES]]||'—',26))+'</td>'+
        '<td style="color:var(--tinta2)">'+esc(D.pagar_desc[l.i]||'')+'</td>'+
        '<td>'+esc(cortar(D.cat[l[CAT]],20))+'</td><td>'+esc(cortar(D.amb[l[AMB]],16))+'</td>'+
        '<td class="r num">'+brl(l[TOTAL])+'</td>'+
        '<td class="r num" style="color:var(--ouro)">'+brl(l[TOTAL]-l[PAGO])+'</td></tr>';
    }).join('') : '<tr><td colspan="8" class="vazio">Nada em aberto.</td></tr>')+
    '</tbody></table></div>'+
    (ab.length > 250 ? '<div class="nota">Mostrando os 250 primeiros de '+ab.length+
      ' vencimentos. Use o filtro de ambiente para estreitar.</div>' : '')+'</div>';
}

/* ===================== VISTA: categorias (o drill) ===================== */
let drDim = 'grupo';
let drCaminho = [];        // [{dim, chave, rotulo}]

function drDescer(dim, chave, rotulo){
  drCaminho.push({dim:dim, chave:chave, rotulo:rotulo});
  desenhar();
}
function drVoltar(n){ drCaminho = drCaminho.slice(0, n); desenhar(); }
function drTrocar(d){ drDim = d; drCaminho = []; desenhar(); }
function abrirCategoria(k){
  drDim = 'cat'; drCaminho = [{dim:'cat', chave:k, rotulo:D.cat[k]}];
  irPara('categorias');
}
// A próxima dimensão é a primeira da escada que ainda não foi usada no caminho.
function proximaDim(extra){
  const usadas = [drDim].concat(drCaminho.map(c => c.dim));
  if(extra) usadas.push(extra);
  for(let i=0;i<ESCADA.length;i++) if(usadas.indexOf(ESCADA[i]) < 0) return ESCADA[i];
  return null;
}
function linhasDoCaminho(lista){
  let l = lista;
  drCaminho.forEach(c => { l = l.filter(x => DIM[c.dim].chave(x) === c.chave); });
  return l;
}

function vistaCategorias(){
  const linhas = linhasDoCaminho(filtrar(D.pagar, COMP));
  const antes = soma(linhasDoCaminho(doAnoAnterior(D.pagar)));
  const total = soma(linhas);
  const prox = drCaminho.length ? proximaDim() : drDim;

  let miolo;
  if(prox){
    const itens = agrupar(linhas, prox);
    const maisFundo = !!proximaDim(prox);
    const acao = it => 'drDescer(\''+prox+'\','+JSON.stringify(it[3])+',&quot;'+
      esc(String(it[0])).replace(/'/g,'&#39;')+'&quot;)';
    miolo =
      '<div class="grade" style="grid-template-columns:1.55fr 1fr">'+
      '<div class="painel"><h2>Por '+esc(DIM[prox].rot.toLowerCase())+'</h2>'+
        '<div class="leg">'+(maisFundo ? 'Clique numa barra para descer mais um nível.'
          : 'Último corte — abaixo daqui já são os lançamentos, um a um.')+'</div>'+
        ranking(itens.slice(0,12), {corte:26, pe:180, alt:29, clique: acao})+'</div>'+
      '<div class="painel"><h2>Em números</h2>'+
        '<div class="leg">A coluna % é a fatia deste nível, não do total geral.</div>'+
        '<div class="rolar"><table><thead><tr><th>'+esc(DIM[prox].rot)+'</th>'+
        '<th class="r">Valor</th><th class="r">%</th><th class="r">Lanç.</th></tr></thead><tbody>'+
        itens.slice(0,14).map(it =>
          '<tr class="cl" onclick="'+acao(it)+'">'+
          '<td style="color:var(--sinal)">'+esc(cortar(it[0],26))+'</td>'+
          '<td class="r num">'+brl(it[1])+'</td>'+
          '<td class="r num" style="color:var(--tinta3)">'+(100*it[1]/(total||1)).toFixed(0)+'%</td>'+
          '<td class="r num" style="color:var(--tinta3)">'+it[2]+'</td></tr>').join('')+
        '</tbody></table></div></div></div>';
  } else {
    const ord = linhas.slice().sort((a,b) => b[TOTAL]-a[TOTAL]).slice(0,150);
    miolo = '<div class="painel"><h2>Lançamentos</h2>'+
      '<div class="leg">Fim do caminho — cada linha é uma conta lançada no Conta Azul.</div>'+
      '<div class="rolar"><table><thead><tr><th>Competência</th><th>Vencimento</th>'+
      '<th>Descrição</th><th>Fornecedor</th><th>Ambiente</th><th class="r">Valor</th></tr></thead><tbody>'+
      (ord.length ? ord.map(l =>
        '<tr><td class="num">'+fMes(l[COMP].slice(0,7))+'</td><td class="num">'+fData(l[VENC])+'</td>'+
        '<td style="color:var(--tinta2)">'+esc(D.pagar_desc[l.i]||'')+'</td>'+
        '<td>'+esc(cortar(D.forn[l[PES]]||'—',26))+'</td>'+
        '<td>'+esc(cortar(D.amb[l[AMB]],18))+'</td>'+
        '<td class="r num">'+brl(l[TOTAL])+'</td></tr>').join('')
       : '<tr><td colspan="6" class="vazio">Nada aqui.</td></tr>')+
      '</tbody></table></div></div>';
  }

  return '<div class="dims">'+
      Object.keys(DIM).map(d => '<button class="chip" aria-pressed="'+
        (drDim===d && !drCaminho.length)+'" onclick="drTrocar(\''+d+'\')">'+
        esc(DIM[d].rot)+'</button>').join('')+
    '</div>'+
    '<div class="migalha"><button onclick="drVoltar(0)">Todo o custo</button>'+
      drCaminho.map((c,i) => '<span>›</span>' + (i === drCaminho.length-1
        ? '<b>'+esc(c.rotulo)+'</b>'
        : '<button onclick="drVoltar('+(i+1)+')">'+esc(c.rotulo)+'</button>')).join('')+
      '<span style="margin-left:auto;font-family:var(--mono);font-size:11px">'+curto(total)+
      (antes ? ' · <span class="'+(total>antes?'desce':'sobe')+'">'+(total>antes?'+':'')+
        pct(total,antes).toFixed(0)+'% vs '+rotuloAnoAnterior()+'</span>' : '')+'</span></div>'+
    miolo;
}

/* ===================== VISTA: ambientes ===================== */
function vistaAmbientes(){
  const p = filtrar(D.pagar, COMP), r = filtrar(D.receber, COMP);
  const pa = doAnoAnterior(D.pagar), ra = doAnoAnterior(D.receber);
  const mapa = new Map();
  const juntar = (lista, campo) => lista.forEach(function(x){
    const a = mapa.get(x[AMB]) || {r:0,c:0,ra:0,ca:0};
    a[campo] += x[TOTAL]; mapa.set(x[AMB], a);
  });
  juntar(r,'r'); juntar(p,'c'); juntar(ra,'ra'); juntar(pa,'ca');
  const linhas = Array.from(mapa.entries())
    .map(e => [D.amb[e[0]], e[1].r, e[1].c, e[0], e[1].ra, e[1].ca])
    .sort((a,b) => b[1]-a[1]);
  const tR = soma(r), tC = soma(p);

  return '<div class="grade" style="grid-template-columns:repeat(auto-fit,minmax(178px,1fr))">'+
    kpiReceita('Receita', curto(tR), null, r.length+' lançamento(s)', '', C.alta) +
    kpiCusto('Custo', curto(tC), null, p.length+' lançamento(s)', '', C.sinal2) +
    kpiReceita('Resultado', curto(tR-tC), null, 'receita menos custo', '', C.ouro) +
    kpiReceita('Margem', tR ? (100*(tR-tC)/tR).toFixed(1)+'%' : '—', null,
      'do que entrou, sobrou isto', '', C.ouro) +
  '</div>'+
  '<div class="painel"><h2>Cada ambiente se paga?</h2>'+
    '<div class="leg">Receita e custo lado a lado, por competência.</div>'+
    colunas(linhas.map(x=>cortar(x[0],13)),
      {nome:'Receita',dados:linhas.map(x=>x[1]),cor:C.alta},
      {nome:'Custo',dados:linhas.map(x=>x[2]),cor:C.sinal2}, null, 250)+
    '<div class="cores"><span><i style="background:'+C.alta+'"></i>receita</span>'+
    '<span><i style="background:'+C.sinal2+'"></i>custo</span></div></div>'+
  '<div class="painel"><h2>Números por ambiente</h2>'+
    '<div class="leg">Clique numa linha para filtrar a tela inteira por aquele ambiente. '+
    'A última coluna é o mesmo intervalo do ano passado — é ali que mora a decisão.</div>'+
    '<div class="rolar"><table><thead><tr><th>Ambiente</th><th class="r">Receita</th>'+
    '<th class="r">Custo</th><th class="r">Resultado</th><th class="r">Margem</th>'+
    '<th class="r">Resultado em '+rotuloAnoAnterior()+'</th></tr></thead><tbody>'+
    (linhas.length ? linhas.map(function(x){
      const res = x[1]-x[2], resA = x[4]-x[5];
      return '<tr class="cl" onclick="escolherAmb('+x[3]+')">'+
        '<td'+(F.amb===String(x[3])?' style="color:var(--sinal)"':'')+'>'+esc(x[0])+'</td>'+
        '<td class="r num sobe">'+brl(x[1])+'</td><td class="r num desce">'+brl(x[2])+'</td>'+
        '<td class="r num '+(res>=0?'sobe':'desce')+'">'+brl(res)+'</td>'+
        '<td class="r num">'+(x[1] ? (100*res/x[1]).toFixed(1)+'%' : '—')+'</td>'+
        '<td class="r num" style="color:var(--tinta3)">'+((x[4]||x[5]) ? brl(resA) : '—')+'</td></tr>';
    }).join('') : '<tr><td colspan="6" class="vazio">Nada no período.</td></tr>')+
    '</tbody></table></div></div>';
}

/* ===================== VISTA: DRE ===================== */
// A ordem é a da demonstração de resultado, não a do tamanho: quem lê espera
// custo do serviço antes de despesa administrativa, mesmo que uma seja maior.
const ORDEM_DRE = ['Custo dos serviços','Administrativas','Operacionais','Impostos sobre vendas',
                   'Comerciais','Comissões','Financeiras','Não operacionais','Investimentos',
                   'Empréstimos e dívidas','Descontos concedidos','Sem grupo definido'];
let dreAberto = 1;

function vistaDre(){
  const p = filtrar(D.pagar, COMP), r = filtrar(D.receber, COMP);
  const receita = soma(r), custo = soma(p);
  const porGrupo = {};
  agrupar(p,'grupo').forEach(g => porGrupo[g[0]] = g[1]);

  const usados = ORDEM_DRE.filter(g => porGrupo[g] > 0)
    .concat(Object.keys(porGrupo).filter(g => ORDEM_DRE.indexOf(g) < 0));
  const grandes = usados.slice(0,5), resto = usados.slice(5);
  const restoTotal = resto.reduce((s,g)=>s+(porGrupo[g]||0),0);

  const passos = [{nome:'Receita', v:receita, delta:receita, total:true, cor:C.alta,
                   dica:'entrou', tipo:'rec'}];
  grandes.forEach(g => passos.push({nome:g, v:porGrupo[g], delta:-porGrupo[g], cor:C.sinal2,
    dica:'saiu', tipo:'grupo', grupo:g}));
  if(restoTotal > 0) passos.push({nome:'Outras saídas', v:restoTotal, delta:-restoTotal,
    cor:C.sinal3, dica:resto.length+' grupos', tipo:'resto'});
  passos.push({nome:'Resultado', v:receita-custo, delta:0, total:true, cor:C.ouro,
    dica:'sobrou', tipo:'res'});

  if(dreAberto >= passos.length) dreAberto = 0;
  const alvo = passos[dreAberto];
  let dentro, titulo, legenda, corFn = null;
  if(alvo.tipo === 'rec'){
    dentro = agrupar(r,'cat').slice(0,10);
    titulo = 'Dentro de Receita'; legenda = 'Tudo que entrou no período, por categoria.';
    corFn = function(){ return C.alta; };
  } else if(alvo.tipo === 'res'){
    dentro = [['Receita',receita],['Custo',custo],['Resultado',receita-custo]];
    titulo = 'O que sobrou';
    legenda = curto(receita)+' entraram, '+curto(custo)+' saíram. Margem de '+
      (receita ? (100*(receita-custo)/receita).toFixed(1) : '0')+'%.';
    corFn = function(it){ return it[0]==='Receita'?C.alta:it[0]==='Custo'?C.sinal2:C.ouro; };
  } else if(alvo.tipo === 'resto'){
    dentro = agrupar(p.filter(l => resto.indexOf(D.grupo[D.cat_grupo[l[CAT]]]) >= 0),'cat').slice(0,10);
    titulo = 'Dentro de Outras saídas'; legenda = 'Reúne: '+resto.join(', ')+'.';
  } else {
    dentro = agrupar(p.filter(l => D.grupo[D.cat_grupo[l[CAT]]] === alvo.grupo),'cat').slice(0,10);
    titulo = 'Dentro de '+alvo.nome; legenda = 'As categorias que formam este degrau.';
  }

  const ms = mesesNoFiltro();
  const pa = doAnoAnterior(D.pagar);
  const sc = ms.map(m => soma(p.filter(l => l[COMP].slice(0,7)===m)));
  const scA = ms.map(m => soma(pa.filter(l => l[COMP].slice(0,7) === anoAntes(m))));
  const tm = sc.reduce((s,v)=>s+v,0), tmA = scA.reduce((s,v)=>s+v,0);

  return '<div class="painel"><h2>De onde saiu o resultado — '+esc(rotuloPeriodo())+'</h2>'+
    '<div class="leg">Entrou tanto, saiu por aqui, sobrou isto. Clique num degrau para ver as '+
    'categorias que o formam.</div>'+
    cascata(passos, i => 'dreVer('+i+')')+
    '<div class="cores"><span><i style="background:'+C.alta+'"></i>o que entrou</span>'+
    '<span><i style="background:'+C.sinal2+'"></i>o que saiu</span>'+
    '<span><i style="background:'+C.ouro+'"></i>o que sobrou</span></div></div>'+
  '<div class="grade" style="grid-template-columns:1fr 1.25fr">'+
    '<div class="painel"><h2>'+esc(titulo)+'</h2><div class="leg">'+esc(legenda)+'</div>'+
      ranking(dentro, {corte:24, pe:164, alt:26, cor:corFn})+'</div>'+
    '<div class="painel"><h2>Mês a mês, contra o ano passado</h2>'+
      '<div class="leg">A coluna <b>peso</b> é quanto o mês representa do custo do período — a leitura '+
      'vertical que a contabilidade pede.</div>'+
      '<div class="rolar"><table><thead><tr><th>Mês</th><th class="r">Custo</th>'+
      '<th class="r">'+rotuloAnoAnterior()+'</th><th class="r">Variação</th>'+
      '<th class="r">Peso</th></tr></thead><tbody>'+
      ms.map(function(m,i){
        const d = pct(sc[i], scA[i]);
        return '<tr><td>'+fMes(m)+'</td><td class="r num">'+brl(sc[i])+'</td>'+
          '<td class="r num" style="color:var(--tinta3)">'+(scA[i]?brl(scA[i]):'—')+'</td>'+
          '<td class="r num '+(d>0?'desce':'sobe')+'">'+(scA[i]?(d>0?'+':'')+d.toFixed(0)+'%':'—')+'</td>'+
          '<td class="r num" style="color:var(--tinta3)">'+(tm?(100*sc[i]/tm).toFixed(0):'0')+'%</td></tr>';
      }).join('')+
      '<tr style="border-top:2px solid var(--fio2)"><td><b>Total</b></td>'+
      '<td class="r num"><b>'+brl(tm)+'</b></td>'+
      '<td class="r num" style="color:var(--tinta3)">'+(tmA?brl(tmA):'—')+'</td>'+
      '<td class="r num '+(pct(tm,tmA)>0?'desce':'sobe')+'">'+
        (tmA?(pct(tm,tmA)>0?'+':'')+pct(tm,tmA).toFixed(0)+'%':'—')+'</td>'+
      '<td class="r num" style="color:var(--tinta3)">100%</td></tr>'+
      '</tbody></table></div></div></div>';
}
function dreVer(i){ dreAberto = i; desenhar(); }

/* ===================== VISTA: compras ===================== */
let COMPRAS = null;

function vistaCompras(){
  if(COMPRAS === null){
    carregarCompras();
    return '<div class="painel"><div class="vazio">Buscando os pedidos do portal de Compras…</div></div>';
  }
  if(COMPRAS.erro)
    return '<div class="painel"><div class="vazio">Não deu para ler o portal de Compras:<br/>'+
      esc(COMPRAS.erro)+'</div></div>';

  // Um pedido "achou par" quando existe conta a pagar do MESMO valor (1 centavo
  // de tolerância) com vencimento até 60 dias depois da compra. Valor + prazo é o
  // que dá para cruzar: o fornecedor no Compras é digitado à mão e no Conta Azul
  // é razão social, então bater por nome produziria par falso o tempo todo.
  const candidatas = D.pagar.filter(l => !l[MOV]);
  function achouPar(p){
    if(p.conta_azul_ref) return {ok:true, como:'referência anotada: '+p.conta_azul_ref};
    if(!p.comprado_em || !p.valor_final) return {ok:false, como:''};
    const dia = p.comprado_em.slice(0,10), limite = somarDias(dia,60), v = +p.valor_final;
    const par = candidatas.filter(l => Math.abs(l[TOTAL]-v) < 0.011 &&
      l[VENC] >= dia && l[VENC] <= limite)[0];
    return par ? {ok:true, como:'vence '+fData(par[VENC])+' · '+(D.forn[par[PES]]||'')}
               : {ok:false, como:''};
  }
  const ETAPA = { compra_realizada:'Compra realizada', inclusao_conta_azul:'Inclusão no Conta Azul',
                  recebimento:'Recebimento', concluida:'Concluída' };
  const comprados = COMPRAS.filter(p => ETAPA[p.status]);
  const avaliados = comprados.map(p => Object.assign({}, p, {par: achouPar(p)}));
  const semPar = avaliados.filter(p => !p.par.ok);
  const totalC = comprados.reduce((s,p)=>s+(+p.valor_final||0),0);
  const totalS = semPar.reduce((s,p)=>s+(+p.valor_final||0),0);

  return '<div class="grade" style="grid-template-columns:repeat(auto-fit,minmax(178px,1fr))">'+
    kpiCusto('Pedidos comprados', String(comprados.length), null,
      'com valor final preenchido', '', C.sinal) +
    kpiCusto('Valor comprado', curto(totalC), null, 'no portal de Compras', '', C.sinal2) +
    kpiCusto('Sem par no Conta Azul', String(semPar.length), semPar.length?1:null,
      semPar.length ? 'conferir com o financeiro' : 'todos encontrados', '', C.baixa) +
    kpiCusto('Valor sem par', curto(totalS), totalS?1:null,
      'pode não estar no financeiro', '', C.ouro) +
  '</div>'+
  '<div class="painel"><h2>Pedido comprado que ainda não virou conta a pagar</h2>'+
    '<div class="leg">O portal de Compras tem uma etapa chamada <b>Inclusão no Conta Azul</b>. '+
    'Aqui a gente confere se ela aconteceu de verdade: para cada pedido comprado, procuramos um '+
    'lançamento do mesmo valor vencendo em até 60 dias.</div>'+
    '<div class="rolar"><table><thead><tr><th>Pedido</th><th>Comprado em</th><th>Etapa</th>'+
    '<th>Solicitante</th><th>Justificativa</th><th class="r">Valor</th><th>No Conta Azul</th>'+
    '</tr></thead><tbody>'+
    (avaliados.length ? avaliados.map(p =>
      '<tr><td>'+esc(p.numero||'—')+'</td>'+
      '<td class="num">'+(p.comprado_em ? fData(p.comprado_em.slice(0,10)) : '—')+'</td>'+
      '<td>'+esc(ETAPA[p.status])+'</td>'+
      '<td>'+esc((p.solicitante_email||'').split('@')[0])+'</td>'+
      '<td style="color:var(--tinta2)">'+esc(cortar(p.justificativa||'',60))+'</td>'+
      '<td class="r num">'+brl(+p.valor_final||0)+'</td>'+
      '<td>'+(p.par.ok
        ? '<span class="tag ok">encontrado</span> <span style="color:var(--tinta3);font-size:11px">'+
          esc(p.par.como)+'</span>'
        : '<span class="tag venc">não encontrado</span>')+'</td></tr>').join('')
     : '<tr><td colspan="7" class="vazio">Nenhum pedido comprado no portal de Compras ainda.</td></tr>')+
    '</tbody></table></div>'+
    '<div class="nota">Esta seção <b>ignora os filtros de período e ambiente</b> de propósito: um pedido '+
    'comprado em maio pode vencer em agosto, e filtrar por mês esconderia justamente o par que se procura. '+
    'O cruzamento é por valor e prazo — se dois pedidos tiverem o mesmo valor no mesmo período, o par pode '+
    'ser trocado. Quando o pedido tem a referência anotada na etapa "Inclusão no Conta Azul", ela vale mais '+
    'que o cruzamento.</div></div>';
}
async function carregarCompras(){
  const { data, error } = await sb.from('compras_solicitacoes')
    .select('numero,status,valor_final,comprado_em,conta_azul_em,conta_azul_ref,solicitante_email,justificativa')
    .not('valor_final','is',null).order('comprado_em',{ascending:false});
  if(error){ COMPRAS = []; COMPRAS.erro = error.message; }
  else COMPRAS = data || [];
  if(VISTA === 'compras') desenhar();
}

/* ===================== VISTA: ajustes ===================== */
function vistaAjustes(){
  const mov = D.pagar.filter(l => l[MOV]), movR = D.receber.filter(l => l[MOV]);
  const cats = agrupar(mov.concat(movR), 'cat');
  const explicacoes = [
    ['Origem dos dados', 'Conta Azul, pela API. Atualizado em '+esc(D.gerado_em)+'.'],
    ['Custo de quando?', 'Por <b>competência</b> — o mês em que o gasto aconteceu. Uma compra em 12x '+
      'custou o mês da compra, não os doze meses das parcelas.'],
    ['E a fila de pagamento?', 'Por <b>vencimento</b>, e sem recorte de período: uma parcela antiga que '+
      'vence semana que vem continua saindo do caixa.'],
    ['Transferências e empréstimos', 'Ficam <b>fora</b> por padrão. É dinheiro andando entre contas da '+
      'própria casa — entra como despesa numa ponta e receita na outra. O botão no topo mostra tudo.'],
    ['Comparação com o ano passado', 'Sempre o <b>mesmo intervalo</b> do ano anterior, nunca o ano '+
      'fechado: comparar oito meses com doze é o erro clássico deste tipo de tela.'],
    ['Ambientes', 'Vêm do centro de custo do Conta Azul. "ENDOVASCULAR SP" está cadastrado duas vezes '+
      'lá; aqui os dois viram um só.'],
    ['Grupos (DRE)', 'Vêm da classificação do próprio Conta Azul. O que não tem grupo aparece como '+
      '<b>Sem grupo definido</b> em vez de sumir dentro de um "outros".'],
  ];
  return '<div class="painel"><h2>O que entra na conta, e o que fica de fora</h2>'+
    '<div class="leg">Esta seção existe para os números daqui nunca serem uma caixa-preta.</div>'+
    '<table><tbody>'+ explicacoes.map(x =>
      '<tr><td style="width:220px;color:var(--tinta3)">'+x[0]+'</td><td>'+x[1]+'</td></tr>').join('')+
    '</tbody></table></div>'+
  '<div class="painel"><h2>O que está marcado como movimentação</h2>'+
    '<div class="leg">Estas categorias não contam como custo nem como receita. Somam '+
    curto(soma(mov))+' de saída e '+curto(soma(movR))+' de entrada em toda a base.</div>'+
    '<div class="rolar"><table><thead><tr><th>Categoria</th><th class="r">Valor</th>'+
    '<th class="r">Lançamentos</th></tr></thead><tbody>'+
    (cats.length ? cats.map(c => '<tr><td>'+esc(c[0])+'</td><td class="r num">'+brl(c[1])+'</td>'+
      '<td class="r num" style="color:var(--tinta3)">'+c[2]+'</td></tr>').join('')
     : '<tr><td colspan="3" class="vazio">Nada marcado.</td></tr>')+
    '</tbody></table></div></div>';
}

/* ===================== montagem ===================== */
const VISTAS = { torre:vistaTorre, pagar:vistaPagar, categorias:vistaCategorias,
                 ambientes:vistaAmbientes, dre:vistaDre, compras:vistaCompras, ajustes:vistaAjustes };
function desenhar(){
  document.getElementById('vistas').innerHTML = (VISTAS[VISTA] || vistaTorre)();
}
function iniciar(){
  if(!D.pagar.length && !D.receber.length){
    document.querySelector('.tela').innerHTML =
      '<div class="painel"><div class="vazio">Os dados ainda não foram gerados.<br/>'+
      'Rode <code>python _tools/_conta_azul_gerar_portal.py</code>.</div></div>';
    return;
  }
  // A descrição mora numa lista paralela (é o campo mais pesado e só serve no
  // detalhe). Guardar a posição na própria linha evita procurá-la na lista
  // original toda vez que uma tabela é montada.
  D.pagar.forEach((l,i) => l.i = i);
  document.getElementById('quando').textContent = 'Conta Azul · atualizado em ' + D.gerado_em;
  montarFiltros(); montarRail(); desenhar();
}
sb.auth.onAuthStateChange(() => checkAuth());
checkAuth();
</script>
